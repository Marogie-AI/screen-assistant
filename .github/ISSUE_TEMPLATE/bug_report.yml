name: Bug report
description: Report a reproducible Screen Assistant problem
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Screen Assistant. Never attach sensitive screenshots or page content.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use a non-sensitive test page and provide the smallest reliable reproduction.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: macOS, Firefox, Node.js, and Codex CLI versions
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove credentials, personal data, URLs, and captured page content.
